
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task15-streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task15-streamlit
  template:
    metadata:
      labels:
        app: task15-streamlit
    spec:
      containers:
        - name: streamlit
          image: task15-streamlit:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          env:
            - name: FLASK_API_URL
              value: "http://task15-flask-service:5000"
