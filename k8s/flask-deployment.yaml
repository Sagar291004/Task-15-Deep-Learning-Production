
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task15-flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task15-flask
  template:
    metadata:
      labels:
        app: task15-flask
    spec:
      containers:
        - name: flask
          image: task15-flask:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 20
